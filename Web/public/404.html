<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found</title>
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <style>
        .notfound-container {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 1.5rem;
        }
        .notfound-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 3.5rem 2.5rem;
            max-width: 520px;
            box-shadow: var(--card-shadow);
        }
        .notfound-code {
            font-size: 5rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }
        .notfound-btn {
            display: inline-block;
            margin-top: 1.5rem;
            background: var(--primary);
            color: #FFFFFF;
            padding: 0.75rem 1.75rem;
            border-radius: var(--radius-full);
            font-weight: 600;
        }
        .notfound-btn:hover {
            background: var(--primary-hover);
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="nav-container">
            <a href="index.html" class="brand-link">
                <img src="images/logo.png" alt="Logo" class="brand-logo">
                <span class="app-name">Indie Playbook</span>
            </a>
        </div>
    </header>

    <main class="notfound-container">
        <div class="notfound-card">
            <div class="notfound-code">404</div>
            <h1 style="font-size: 1.75rem; margin-bottom: 0.75rem;">Page Not Found</h1>
            <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">The page you are looking for does not exist or may have been moved.</p>
            <a href="index.html" class="notfound-btn">Return to Home</a>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="updateContent.js"></script>
</body>
</html>
